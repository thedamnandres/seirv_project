services:
  db:
    image: postgres:15-alpine
    container_name: seirv-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seirv_network

  backend:
    build: 
      context: ./seirv-backend
      dockerfile: Dockerfile
    container_name: seirv-backend
    restart: always
    working_dir: /code 
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      DEBUG: ${DEBUG}
      API_V1_PREFIX: ${API_V1_PREFIX}
      PYTHONPATH: /code  
    ports:
      - "8000:8000"
    volumes:
      - ./seirv-backend:/code  
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - seirv_network

  frontend:
    build:
      context: ./seirv-frontend
      dockerfile: Dockerfile
    container_name: seirv-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - seirv_network

volumes:
  postgres_data:
    driver: local

networks:
  seirv_network:
    driver: bridge